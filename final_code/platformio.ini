[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk

monitor_speed = 115200
debug_tool = picoprobe
upload_protocol = picoprobe

build_flags =
    -O0
    -std=c++14
    -I lib/Adafruit_BNO08x
    -I lib/Adafruit_Bus_IO
    -I lib/Adafruit_Unified_Sensor
    -I lib/edge-impulse-model
    -I lib/edge-impulse-model/edge-impulse-sdk
    -I lib/edge-impulse-model/edge-impulse-sdk/CMSIS/Core/Include
    -I lib/edge-impulse-model/edge-impulse-sdk/CMSIS/DSP/Include
    -I lib/edge-impulse-model/edge-impulse-sdk/CMSIS/NN/Include
    -D EIDSP_USE_CMSIS_DSP=1
    -D EI_CLASSIFIER_TFLITE_ENABLE_CMSIS_NN=1
    -D ARM_MATH_LOOPUNROLL
    ; --- FIX #2: Add this macro to enable CMSIS-DSP linking ---
    -D EIDSP_LOAD_CMSIS_DSP_SOURCES=1

lib_archive = no

build_src_filter =
    +<*>
    +<../lib/edge-impulse-model/tflite-model/*.cpp>
    +<../lib/edge-impulse-model/edge-impulse-sdk/dsp/*/*.cpp>
    +<../lib/edge-impulse-model/edge-impulse-sdk/dsp/*/*.c>
    +<../lib/edge-impulse-model/edge-impulse-sdk/tensorflow/lite/c/*.c>
    +<../lib/edge-impulse-model/edge-impulse-sdk/tensorflow/lite/core/api/*.cc>
    +<../lib/edge-impulse-model/edge-impulse-sdk/tensorflow/lite/kernels/*.cc>
    +<../lib/edge-impulse-model/edge-impulse-sdk/tensorflow/lite/kernels/internal/*.cc>
    +<../lib/edge-impulse-model/edge-impulse-sdk/tensorflow/lite/micro/*.cc>
    +<../lib/edge-impulse-model/edge-impulse-sdk/tensorflow/lite/micro/kernels/*.cc>
    +<../lib/edge-impulse-model/edge-impulse-sdk/tensorflow/lite/micro/memory_planner/*.cc>
    +<../lib/edge-impulse-model/edge-impulse-sdk/CMSIS/NN/Source/*/*.c>
    +<../lib/edge-impulse-model/edge-impulse-sdk/CMSIS/DSP/Source/*/*.c>