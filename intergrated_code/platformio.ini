[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk

; Build all source with no optimization (easier debugging)
build_src_flags = -O0

monitor_speed = 115200
debug_tool = picoprobe
upload_protocol = picoprobe

build_flags =
    -O0
    -std=c++17

    ; ---------- IMU / Adafruit BNO08x + Edge Impulse includes ----------
    ; These paths are relative to the project root:
    ; integrated_code/lib/imu/lib/...
    -Ilib/imu/lib/Adafruit_BNO08x
    -Ilib/imu/lib/Adafruit_Bus_IO
    -Ilib/imu/lib/Adafruit_Unified_Sensor

    ; Edge Impulse exported project
    -Ilib/imu/lib/edge-impulse-model
    -Ilib/imu/lib/edge-impulse-model/edge-impulse-sdk
    -Ilib/imu/lib/edge-impulse-model/edge-impulse-sdk/CMSIS/Core/Include
    -Ilib/imu/lib/edge-impulse-model/edge-impulse-sdk/CMSIS/DSP/Include
    -Ilib/imu/lib/edge-impulse-model/edge-impulse-sdk/CMSIS/NN/Include

    ; ---------- Edge Impulse / CMSIS defines ----------
    -D EIDSP_USE_CMSIS_DSP=1
    -D EI_CLASSIFIER_TFLITE_ENABLE_CMSIS_NN=1
    -D ARM_MATH_LOOPUNROLL
    ; Enable CMSIS-DSP source loading (as done in EI examples)
    -D EIDSP_LOAD_CMSIS_DSP_SOURCES=1

; Don’t archive libs to avoid link issues with EI / CMSIS
lib_archive = no

; Tell PlatformIO which extra source files to compile
; Paths here are relative to src/, so we go up to ../lib/imu/lib/...
build_src_filter =
    +<*> ; Include all files from src/

    ; Edge Impulse SDK Source Files (adjusted for lib/imu/lib layout)
    +<../lib/imu/lib/edge-impulse-model/tflite-model/*.cpp>
    +<../lib/imu/lib/edge-impulse-model/edge-impulse-sdk/dsp/*/*.cpp>
    +<../lib/imu/lib/edge-impulse-model/edge-impulse-sdk/dsp/*/*.c>
    +<../lib/imu/lib/edge-impulse-model/edge-impulse-sdk/tensorflow/lite/c/*.c>
    +<../lib/imu/lib/edge-impulse-model/edge-impulse-sdk/tensorflow/lite/core/api/*.cc>
    +<../lib/imu/lib/edge-impulse-model/edge-impulse-sdk/tensorflow/lite/kernels/*.cc>
    +<../lib/imu/lib/edge-impulse-model/edge-impulse-sdk/tensorflow/lite/kernels/internal/*.cc>
    +<../lib/imu/lib/edge-impulse-model/edge-impulse-sdk/tensorflow/lite/micro/*.cc>
    +<../lib/imu/lib/edge-impulse-model/edge-impulse-sdk/tensorflow/lite/micro/kernels/*.cc>
    +<../lib/imu/lib/edge-impulse-model/edge-impulse-sdk/tensorflow/lite/micro/memory_planner/*.cc>
    +<../lib/imu/lib/edge-impulse-model/edge-impulse-sdk/CMSIS/NN/Source/*/*.c>
    +<../lib/imu/lib/edge-impulse-model/edge-impulse-sdk/CMSIS/DSP/Source/*/*.c>
